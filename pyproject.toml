[project]
name = "first-project-aqa"
version = "0.1.0"
description = "Фреймворк API-автотестов: pytest + requests + Pydantic + SQLAlchemy + Allure"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "requests>=2.34",
    "pydantic>=2.14",
    "SQLAlchemy>=2.1",
    "psycopg2-binary>=2.9",
    "rstr>=3.2",
    "h11>=0.16",
]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "allure-pytest>=2.16",
    "pytest-asyncio>=1.4",
]

[tool.uv]
package = false
